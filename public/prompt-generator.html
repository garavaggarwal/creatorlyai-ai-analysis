<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Creatorly AI — CreatorlyAI Strategist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      corePlugins: {
        preflight: false
      }
    }
  </script>
</head>
<body class="bg-[#0f0f1a] text-slate-100 flex flex-col h-screen overflow-hidden m-0">

  <!-- ── HEADER ── -->
  <header class="h-[56px] border-b border-solid border-[#2d2d44] flex items-center justify-between px-4 bg-[#0f0f1a] shrink-0 z-10">
    <a href="/" class="flex items-center gap-2.5 text-white no-underline">
      <div class="logo-mark-analyser">
        <svg width="26" height="26" viewBox="0 0 32 32" fill="none">
          <defs><linearGradient id="alg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#a855f7"/><stop offset="100%" stop-color="#6366f1"/></linearGradient></defs>
          <rect width="32" height="32" rx="9" fill="url(#alg)"/>
          <path d="M8 16 L14 10 L20 16 L26 10" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M8 22 L14 16 L20 22 L26 16" stroke="rgba(255,255,255,0.5)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <span class="text-[1.1rem]"><span class="font-bold">Creatorly</span> <span class="text-[#a855f7] font-extrabold">AI</span></span>
    </a>
    <div class="flex items-center gap-3">
      <button class="bg-none border-none text-[#94a3b8] text-xs cursor-pointer font-medium px-2 py-1 rounded transition-all hover:text-red-500 hover:bg-[rgba(239,68,68,0.08)]" id="creatorlyChatClearBtn">Clear Chat</button>
    </div>
  </header>

  <!-- ── CHAT CONTENT CONTAINER ── -->
  <main class="flex-1 flex flex-col min-h-0 bg-[rgba(15,12,30,0.95)] max-w-[600px] w-full mx-auto border-x border-solid border-[rgba(255,255,255,0.08)]">
    <!-- Messages Area -->
    <div class="flex-1 overflow-y-auto p-5 flex flex-col gap-4 scroll-smooth" id="creatorlyChatMessages"></div>

    <!-- Input Area -->
    <div class="p-4 border-t border-solid border-[rgba(255,255,255,0.08)] bg-[rgba(255,255,255,0.005)] shrink-0">
      <form class="flex gap-2.5 items-center m-0" id="creatorlyChatForm">
        <input type="text" class="flex-1 bg-[rgba(255,255,255,0.04)] border border-solid border-[rgba(255,255,255,0.08)] rounded-xl px-4 py-3 text-sm text-slate-100 outline-none transition-all focus:border-[rgba(168,85,247,0.5)] focus:bg-[rgba(255,255,255,0.06)] placeholder-[#64748b]" id="creatorlyChatInput" placeholder="Ask about hooks, rates, captions..." autocomplete="off" />
        <button type="submit" class="w-10 h-10 rounded-xl bg-gradient-to-br from-[#a855f7] to-[#6366f1] border-none text-white cursor-pointer flex items-center justify-center transition-all hover:scale-105 disabled:bg-[rgba(255,255,255,0.05)] disabled:text-[#64748b] disabled:cursor-not-allowed disabled:scale-100 shrink-0" id="creatorlyChatSendBtn" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </form>
    </div>
  </main>

  <!-- ── BOTTOM NAV ── -->
  <nav class="bottom-nav">
    <a href="/" class="bottom-nav-item">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Home</span>
    </a>
    <a href="/prompt-generator" class="bottom-nav-item active">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span>Chatbot</span>
    </a>
    <a href="/analyser" class="bottom-nav-item">
      <div class="nav-plus-btn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </div>
      <span>Analyse</span>
    </a>
    <a href="/analyser#history" class="bottom-nav-item">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      <span>History</span>
    </a>
    <a href="/profile" class="bottom-nav-item">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span>Profile</span>
    </a>
  </nav>

  <script src="/auth.js"></script>
  <script src="/chatbot.js"></script>
</body>
</html>
