<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Creatorly AI — Prompt Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/prompt-generator.css" />
</head>
<body>

  <!-- ── HEADER ── -->
  <header class="top-header">
    <a href="/" class="header-logo">
      <svg width="28" height="28" viewBox="0 0 32 32" fill="none"><defs><linearGradient id="lg1" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#a855f7"/><stop offset="100%" stop-color="#6366f1"/></linearGradient></defs><rect width="32" height="32" rx="9" fill="url(#lg1)"/><path d="M8 16 L14 10 L20 16 L26 10" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 22 L14 16 L20 22 L26 16" stroke="rgba(255,255,255,0.5)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="header-logo-text">Creatorly <span class="accent">AI</span></span>
    </a>
  </header>

  <main class="pg-main">
    <div class="pg-hero">
      <h1 class="pg-title">✨ Reel Prompt Generator</h1>
      <p class="pg-sub">Describe your reel idea and get ready-to-paste prompts for AI video tools</p>
    </div>

    <!-- ── INPUT FORM ── -->
    <form class="pg-form" id="pgForm">
      <div class="pg-input-group">
        <label class="pg-label" for="pgIdea">What kind of reel do you want?</label>
        <textarea class="pg-textarea" id="pgIdea" placeholder="e.g. Gym motivation reel with cinematic lighting, Indian fitness creator vibe, trending audio feel..." maxlength="500" rows="3"></textarea>
        <div class="pg-char-count"><span id="pgCharCount">0</span>/500</div>
      </div>

      <div class="pg-input-group">
        <label class="pg-label" for="pgTool">AI Video Tool</label>
        <select class="pg-select" id="pgTool">
          <option value="General">General (any tool)</option>
          <option value="Runway">Runway Gen-3</option>
          <option value="Kling">Kling AI</option>
          <option value="Sora">Sora (OpenAI)</option>
          <option value="Pika">Pika Labs</option>
          <option value="Vidu">Vidu</option>
          <option value="Hailuo">Hailuo MiniMax</option>
        </select>
      </div>

      <button type="submit" class="pg-submit-btn" id="pgSubmitBtn" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
        <span>Generate Prompts</span>
      </button>
    </form>

    <!-- ── LOADING ── -->
    <div class="pg-loading" id="pgLoading" hidden>
      <div class="pg-spinner"></div>
      <p class="pg-loading-text">Generating prompts with AI...</p>
    </div>

    <!-- ── RESULTS ── -->
    <div class="pg-results" id="pgResults" hidden>
      <h2 class="pg-results-title">Your Prompts</h2>
      <div class="pg-results-tool" id="pgResultsTool"></div>
      <div class="pg-prompts-list" id="pgPromptsList"></div>
      <button class="pg-again-btn" id="pgAgainBtn">Generate More</button>
    </div>

    <!-- ── ERROR ── -->
    <div class="pg-error" id="pgError" hidden>
      <div class="pg-error-icon">⚠️</div>
      <p class="pg-error-msg" id="pgErrorMsg">Something went wrong</p>
      <button class="pg-again-btn" id="pgRetryBtn">Try Again</button>
    </div>
  </main>

  <!-- ── BOTTOM NAV ── -->
  <nav class="bottom-nav">
    <a href="/" class="bottom-nav-item">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Home</span>
    </a>
    <a href="/analyser" class="bottom-nav-item">
      <div class="nav-plus-btn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </div>
      <span>Analyse</span>
    </a>
    <a href="/prompt-generator" class="bottom-nav-item active">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
      <span>Prompts</span>
    </a>
    <a href="/profile" class="bottom-nav-item">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span>Profile</span>
    </a>
  </nav>

  <script src="/auth.js"></script>
  <script src="/prompt-generator.js"></script>
</body>
</html>
