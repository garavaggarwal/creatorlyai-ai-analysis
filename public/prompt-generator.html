<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Creatorly AI — Ask AI</title>
  <meta name="description" content="Ask AI - Your personal Instagram growth strategist powered by Creatorly AI." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
  <style>
    /* ── Core layout: full screen, no scroll on body ── */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0c0b18;
      font-family: 'Inter', sans-serif;
      color: #f1f5f9;
    }

    /* ── Fixed Header ── */
    #askAiHeader {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 200;
      height: 56px;
      background: rgba(12, 11, 24, 0.97);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255,255,255,0.07);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }

    #askAiHeader .header-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #fff;
    }
    #askAiHeader .header-logo .logo-mark-analyser {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: linear-gradient(135deg, #a855f7, #6366f1);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #askAiHeader .header-title {
      font-size: 1rem;
      font-weight: 700;
      color: #f1f5f9;
    }
    #askAiHeader .header-title span {
      color: #a855f7;
    }

    #creatorlyChatClearBtn {
      background: none;
      border: 1px solid rgba(255,255,255,0.1);
      color: #94a3b8;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      padding: 5px 12px;
      border-radius: 8px;
      font-family: inherit;
      transition: all 0.2s;
    }
    #creatorlyChatClearBtn:hover {
      color: #ef4444;
      border-color: rgba(239,68,68,0.3);
      background: rgba(239,68,68,0.06);
    }

    /* ── Scrollable messages area (between header and input bar) ── */
    #creatorlyChatMessages {
      position: fixed;
      top: 56px;      /* below header */
      left: 0;
      right: 0;
      bottom: calc(148px + env(safe-area-inset-bottom)); /* above input + bottom nav with safe spacing */
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      padding: 20px 16px 8px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 600px;
      margin: 0 auto;
      box-sizing: border-box;
    }

    /* ── Fixed Input Bar — always pinned above the bottom nav ── */
    #chatInputBar {
      position: fixed;
      left: 0;
      right: 0;
      z-index: 600; /* Ensure z-index is above bottom nav */
      background: rgba(12, 11, 24, 0.97);
      backdrop-filter: blur(16px);
      border-top: 1px solid rgba(255,255,255,0.07);
      padding: 10px 16px;
      bottom: calc(76px + env(safe-area-inset-bottom)); /* sit cleanly above bottom nav */
    }

    /* When keyboard is open (body.keyboard-open), bottom nav hides
       so input bar goes to bottom: env(safe-area-inset-bottom) */
    body.keyboard-open #chatInputBar {
      bottom: env(safe-area-inset-bottom, 0px);
    }

    body.keyboard-open #creatorlyChatMessages {
      bottom: calc(72px + env(safe-area-inset-bottom));
    }

    /* Desktop: no bottom nav */
    @media (min-width: 1024px) {
      #chatInputBar {
        bottom: 0;
        max-width: 600px;
        left: 50%;
        transform: translateX(-50%);
        border-left: 1px solid rgba(255,255,255,0.07);
        border-right: 1px solid rgba(255,255,255,0.07);
      }
      #creatorlyChatMessages {
        bottom: 76px;
        left: 50%;
        transform: translateX(-50%);
        width: 100%;
      }
    }

    #chatInputBar form {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0;
    }

    #creatorlyChatInput {
      flex: 1;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      padding: 12px 16px;
      font-size: 0.875rem;
      font-family: 'Inter', sans-serif;
      color: #f1f5f9;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
      min-width: 0;
    }
    #creatorlyChatInput:focus {
      border-color: rgba(168, 85, 247, 0.5);
      background: rgba(255,255,255,0.07);
    }
    #creatorlyChatInput::placeholder {
      color: #475569;
    }
    #creatorlyChatInput:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #creatorlyChatSendBtn {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, #a855f7, #6366f1);
      border: none;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s, opacity 0.2s;
      flex-shrink: 0;
    }
    #creatorlyChatSendBtn:hover:not(:disabled) {
      transform: scale(1.05);
    }
    #creatorlyChatSendBtn:disabled {
      background: rgba(255,255,255,0.06);
      color: #475569;
      cursor: not-allowed;
      transform: none;
    }

    /* ── Bottom Nav override for Ask AI page ── */
    .bottom-nav {
      z-index: 500;
    }

    body.keyboard-open .bottom-nav {
      display: none !important;
    }

    /* On desktop, hide bottom nav */
    @media (min-width: 1024px) {
      .bottom-nav { display: none; }
    }
  </style>
</head>
<body>

  <!-- ── FIXED HEADER ── -->
  <header id="askAiHeader">
    <a href="/" class="header-logo">
      <div class="logo-mark-analyser">
        <svg width="18" height="18" viewBox="0 0 32 32" fill="none">
          <path d="M8 16 L14 10 L20 16 L26 10" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M8 22 L14 16 L20 22 L26 16" stroke="rgba(255,255,255,0.6)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <span class="header-title">Creatorly <span>AI</span></span>
    </a>
    <button id="creatorlyChatClearBtn">Clear Chat</button>
  </header>

  <!-- ── SCROLLABLE MESSAGES ── -->
  <div id="creatorlyChatMessages"></div>

  <!-- ── FIXED INPUT BAR (always above bottom nav) ── -->
  <div id="chatInputBar">
    <form id="creatorlyChatForm">
      <input
        type="text"
        id="creatorlyChatInput"
        placeholder="Ask about hooks, rates, captions..."
        autocomplete="off"
      />
      <button type="submit" id="creatorlyChatSendBtn" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </form>
  </div>

  <!-- ── BOTTOM NAV ── -->
  <nav class="bottom-nav">
    <a href="/analyser" class="bottom-nav-item">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Home</span>
    </a>
    <a href="/prompt-generator" class="bottom-nav-item active">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span>Ask AI</span>
    </a>
    <a href="/analyser" class="bottom-nav-item">
      <div class="nav-plus-btn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </div>
      <span>Analyse</span>
    </a>
    <a href="/rate-card" class="bottom-nav-item">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><rect x="2" y="4" width="20" height="16" rx="2" ry="2"/><line x1="12" y1="4" x2="12" y2="20"/><line x1="2" y1="12" x2="22" y2="12"/></svg>
      <span>Rate Card</span>
    </a>
    <a href="/profile" class="bottom-nav-item">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span>Profile</span>
    </a>
  </nav>

  <script src="/auth.js"></script>
  <script src="/chatbot.js"></script>
</body>
</html>
